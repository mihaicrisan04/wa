[tools]
bun = "1.4.2"
# Raycast's `ray` CLI runs on node
node = "24"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install all workspace dependencies from the lockfile"
run = "bun install --frozen-lockfile"

[tasks.typecheck]
description = "Type-check every package"
run = [
  "tsc --noEmit -p packages/sdk",
  "tsc --noEmit -p packages/engine",
  "tsc --noEmit -p apps/cli",
  "tsc --noEmit -p apps/raycast",
  "tsc --noEmit -p apps/raycast/test",
]

[tasks.lint]
description = "Lint with oxlint"
run = "oxlint --deny-warnings"

[tasks."lint:fix"]
description = "Lint and auto-fix with oxlint"
run = "oxlint --fix"

[tasks.format]
description = "Format with oxfmt"
run = "oxfmt"

[tasks."format:check"]
description = "Check formatting with oxfmt"
run = "oxfmt --check"

[tasks.test]
description = "Run every test suite"
run = "bun test"

[tasks.build]
description = "Compile the wa binary into dist/wa"
run = "bun build --compile --minify apps/cli/src/index.ts --outfile dist/wa"

[tasks."build:raycast"]
description = "Build the Raycast extension into apps/raycast/dist (never installs it)"
dir = "{{config_root}}/apps/raycast"
run = "node_modules/.bin/ray build -e dist -o dist --non-interactive"

[tasks.selftest]
description = "Run the offline selftest against the compiled binary"
depends = ["build"]
run = "dist/wa selftest"

[tasks.check]
description = "Everything CI runs"
run = [
  "mise run lint",
  "mise run format:check",
  "mise run typecheck",
  "mise run test",
  "mise run selftest",
  "mise run build:raycast",
  "git check-ignore -q daemon/auth_info/creds.json",
]

[tasks."dev:engine"]
description = "Run the engine from source with reload, on a dev data dir and port"
run = 'WA_HOME="${WA_HOME:-{{config_root}}/.wa-dev}" WA_PORT="${WA_PORT:-7374}" bun --watch apps/cli/src/index.ts serve'

[tasks."dev:raycast"]
description = "Start the Raycast extension in dev mode (Raycast beta)"
dir = "{{config_root}}/apps/raycast"
env = { RAY_Target = "x" }
run = "node_modules/.bin/ray develop"
